<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 690" width="1100" height="690" role="img" aria-labelledby="t d">
<title id="t">Curia's multi-agent architecture</title>
<desc id="d">You and your contacts reach Curia over its channels, and only the Coordinator talks to people. Inside the Bullpen, the Coordinator delegates to specialists: Calendar, Contacts, CEO Inbox, Research analyst, Meeting debrief, Diagnostics, Setup guide, and any you add. Agents ask the execution layer to run tools, sending tool.invoke and getting tool.result back; it checks each call against the tool's manifest and the autonomy score. It holds about 150 tools: Curia's bundles such as calendar, email, contacts, memory and web, plus Google Workspace tools from an MCP server. Every agent shares one knowledge graph and one store of OKF documents, and every delegation and tool call is in the audit log.</desc>
