<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 448" width="1100" height="448" role="img" aria-labelledby="t d">
<title id="t">Curia's five governance gates</title>
<desc id="d">A message passes five gates in order before Curia acts or replies. 1, channel trust: how strong the channel's proof of identity is; a weak channel starts with lower trust. 2, dispatch policy: trust score, rate limits and an injection scan; an unknown sender gets read-only handling and a flood is dropped and logged. 3, agent autonomy: the autonomy band and a review of each send; if the band doesn't allow it, Curia asks you first. 4, tool action risk: the score must meet the tool's floor (none 0, low 60, medium 70, high 80, critical 90); if not, the call is blocked and an approval request is filed. 5, outbound safety: PII redaction, content rules and a leak check; unsafe content is redacted or held. A message must pass every gate to become an action.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#265058"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#8A3B2E"/></marker></defs>
