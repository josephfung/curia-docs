<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-labelledby="t d">
<title id="t">How a message flows through Curia</title>
<desc id="d">A message arrives on a channel. 1: the channel layer publishes inbound.message. 2: the dispatch layer checks trust, rate limits and prompt injection, then publishes agent.task. 3: the agent layer (the Coordinator and specialists) reasons and publishes tool.invoke. 4: the execution layer checks permissions, runs the tool and publishes tool.result. 5: the agent publishes agent.response. 6: dispatch applies PII redaction and publishes outbound.message. 7: the channel delivers the reply. Every arrow is a typed event on the message bus, and each layer may publish only its own event types. The system layer (audit logger, memory engine, scheduler, dream engine) may publish and read every event; the audit logger writes each event before anyone else receives it.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#265058"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#8A3B2E"/></marker></defs>
