<text x="40" y="248" font-size="11.5" fill="#6E6A62" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="0.12em">ASKS YOU FIRST</text>
<text x="40" y="320" font-size="11.5" fill="#6E6A62" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="0.12em">TOOLS IT MAY RUN · A HARD GATE</text>
<text x="550.0" y="394" font-size="11.5" fill="#6E6A62" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-style="italic">At every band, a send an outsider seems to be steering is held for you, and your own instructions count as approval.</text>
