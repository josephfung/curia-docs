<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" width="1100" height="430" role="img" aria-labelledby="t d">
<title id="t">The autonomy dial</title>
<desc id="d">One score from 0 to 100 sets five bands. Restricted, below 60: proposes and drafts only, and takes no action with an external effect; only read tools run. Draft Only, 60 to 69: drafts and handles internal logistics in confirmed work, asks before anything is sent; low-risk tools such as memory and contacts run. Approval Required, 70 to 79, the default at 75: takes on work and coordinates, asks before speaking or committing for you; sends run. Spot-check, 80 to 89: speaks for you on routine matters, asks before committing you to dates, terms or introductions; calendar writes and commitments run. Full, 90 to 100: speaks and commits for you, asks first on payments, pricing, contracts and legal positions; critical tools run. At every band, an outsider steering Curia is held for you.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#265058"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#8A3B2E"/></marker></defs>
