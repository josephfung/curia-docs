<text x="346.0" y="120" font-size="15.5" fill="#1F1F1F" text-anchor="middle" font-family="Lora, Georgia, 'Times New Roman', serif" font-weight="500">Draft Only</text>
<text x="346.0" y="139" font-size="11" fill="#4B5A57" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">60–69</text>
<text x="346.0" y="204" font-size="12" fill="#1F1F1F" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">drafts, and internal</text>
<text x="346.0" y="220" font-size="12" fill="#1F1F1F" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">logistics in confirmed work</text>
<text x="346.0" y="270" font-size="12" fill="#1F1F1F" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">before anything is sent,</text>
