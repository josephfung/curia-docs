<text x="142.0" y="220" font-size="12" fill="#1F1F1F" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">drafts only</text>
<text x="142.0" y="270" font-size="12" fill="#1F1F1F" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">anything with an</text>
<text x="142.0" y="286" font-size="12" fill="#1F1F1F" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">external effect</text>
