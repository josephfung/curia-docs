<text x="754.0" y="270" font-size="12" fill="#1F1F1F" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">before committing you to</text>
<text x="754.0" y="286" font-size="12" fill="#1F1F1F" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">dates, terms or intros</text>
<rect x="660.0" y="330" width="188.0" height="28" rx="6" fill="#F1E8D6" stroke="#CDBE9F" stroke-width="1"/>
<text x="754.0" y="348.14" font-size="11.5" fill="#1F1F1F" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600">+ high: calendar, commitments</text>
<line x1="652.0" y1="182" x2="652.0" y2="296" stroke="rgba(31,31,31,0.18)" stroke-width="1"/>
